[pytest]
pythonpath = .
testpaths = tests
# Any new warning fails the tests. The ignored ones come from protobuf 4.21.12,
# pinned to match protoc 3.21.12 (see requirements.txt), not from GCS code.
filterwarnings =
    error
    ignore:Type google\._upb\._message\.\w+ uses PyType_Spec:DeprecationWarning
    ignore:datetime\.datetime\.utcfromtimestamp:DeprecationWarning:google\.protobuf
