; Settings for both nodes: the simulator (C++) and the GCS (Python).
; Copy this file and pass --config to run the nodes on different machines.
[network]
; Where the GCS sends commands.
simulator_address = 127.0.0.1
; Where the simulator sends video and telemetry.
gcs_address = 127.0.0.1
command_port = 5600
telemetry_port = 5601
video_port = 5602

[video]
; Forward error correction: none, or xor (one parity chunk per group).
fec = xor
; Data chunks per parity chunk; 0 means one parity chunk per frame.
fec_group_size = 0

[simulator]
; Show the simulator's own OpenCV preview window of the rendered frames.
; Debug aid only; the GCS shows the same video. true or false.
preview = true

; Ground Control Station only (the simulator ignores these). The C++ reader
; ignores section names, so every key must be unique across the whole file.
[gcs.link]
; Interface the GCS binds its video and telemetry sockets to.
bind_address = 0.0.0.0
; How often the Tk loop drains the sockets; a 30 fps frame arrives every 33 ms.
poll_ms = 5
; An id this far below the newest means the simulator restarted (resync to
; it); a smaller drop is a late, reordered packet (ignored). A lower id after
; the stream was silent for stale_ms is a restart too. Both are 1 s of data.
restart_gap_frames = 30
restart_gap_packets = 10
; Telemetry packets kept to match each frame with (5 s at 10 Hz).
telemetry_kept = 50
; Link badge: LIVE while the last telemetry is at most live_ms old, STALE up
; to stale_ms, LOST after that.
live_ms = 200
stale_ms = 1000

[gcs.commands]
; The current command is resent this often, and on every change.
resend_ms = 100
; While the link is LOST the resend interval doubles up to this.
backoff_max_ms = 1000
; Stops sent when the GCS closes; several, so one lost datagram cannot leave
; the drone moving (the simulator has no command timeout).
exit_stop_repeats = 3

[gcs.ui]
; Intended speed slider, in percent of the drone's maximum speed.
speed_start_percent = 50
; Dragging the slider (and Shift with -/+) moves by this step.
speed_drag_step_percent = 10
; The - / + buttons (and -/+ keys) move by this step.
speed_nudge_step_percent = 1
; Drawn on top of the video, comma-separated; leave empty for none.
; Available: crosshair (marks the drone at the centre of the frame).
overlays = crosshair
