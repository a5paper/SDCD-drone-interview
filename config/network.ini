; Network settings for the simulator.
; Copy this file and pass --config to run the nodes on different machines.
[network]
; Where the GCS sends commands.
simulator_address = 127.0.0.1
; Where the simulator sends video and telemetry.
gcs_address = 127.0.0.1
command_port = 5600
telemetry_port = 5601
video_port = 5602
